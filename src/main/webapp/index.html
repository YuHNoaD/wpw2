<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murach Survey 2.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="assets/runtime.js" defer></script>
</head>
<body>
    <div class="page-container">
        <header>
            <div class="logo-wrapper">
                <img src="images/logo.png" alt="Murach Logo" class="logo">
            </div>
            <br>
            <span class="badge">✦ Murach Survey Experience 2.0 ✦</span>
            <h1>Survey</h1>
            <p class="intro-text">If you have a moment, we'd appreciate it if you would fill out this survey.</p>
        </header>

        <form action="emailList" method="POST">
            <input type="hidden" name="action" value="add">
            
            <section class="form-section">
                <h2>Your Information</h2>
                
                <div class="field-row">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="e.g. Joel" required>
                </div>

                <div class="field-row">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="e.g. Murach" required>
                </div>

                <div class="field-row">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="joel@murach.com" required>
                </div>

                <div class="field-row">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>
            </section>

            <section class="form-section">
                <h2>How did you hear about us?</h2>
                <div class="horizontal-radios">
                    <label><input type="radio" name="hearAbout" value="search" checked> Search engine</label>
                    <label><input type="radio" name="hearAbout" value="word"> Word of mouth</label>
                    <label><input type="radio" name="hearAbout" value="social"> Social Media</label>
                    <label><input type="radio" name="hearAbout" value="other"> Other</label>
                </div>
            </section>

            <section class="form-section">
                <h2>Announcements & Offers</h2>
                <div class="vertical-checkboxes">
                    <label><input type="checkbox" name="announcements" value="like"> YES, I'd like that.</label>
                    <label><input type="checkbox" name="announcements" value="email_announcements"> YES, please send me email announcements.</label>
                </div>
            </section>

            <section class="form-section field-row contact-row">
                <label for="contactBy">Please contact me by</label>
                <select name="contactBy" id="contactBy">
                    <option value="email_or_postal">Email or postal mail</option>
                    <option value="email">Email only</option>
                    <option value="postal">Postal mail only</option>
                </select>
            </section>

            <button type="submit" class="submit-btn">Submit Survey</button>
        </form>
    </div>
</body>
</html>
